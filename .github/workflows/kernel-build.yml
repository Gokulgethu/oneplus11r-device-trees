name: Build yazhu Kernel

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    # Allows manual trigger from the Actions tab

jobs:
  build-yazhu-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KERNEL_NAME: yazhu
      DEVICE_CODENAME: udon
      DEVICE_MODEL: CPH2487
      # Kernel configuration paths
      KERNEL_DEFCONFIG: vendor/taro-yazhu_defconfig
      KERNEL_SOURCE_PATH: kernel/oneplus/sm8475

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev libelf-dev \
            libllvm-dev llvm-dev \
            git gnupg flex bison build-essential \
            libncurses5-dev libncurses-dev \
            rsync xz-utils file

      - name: Cache kernel compilation state
        uses: actions/cache@v4
        with:
          path: |
            ~/cache/yazhu-kernel
            .config
          key: yazhu-kernel-${{ runner.os }}-${{ hashFiles('**/*.mk', '**/*.conf') }}

      - name: Apply yazhu kernel defconfig
        run: |
          cd /repo_root
          echo "Applying yazhu kernel defconfig for OnePlus 11R..."
          # Use the board config's defconfig as base and overlay yazhu optimizations
          make -C ${KERNEL_SOURCE_PATH} ${KERNEL_DEFCONFIG} O=./kernel-out 2>&1 | tail -20
          # Apply performance optimizations for yazhu kernel
          if [ -f kernel-out/.config ]; then
            # Enable preempt-none for general performance
            scripts/config set kernel-out/.config CONFIG_PREEMPT_NONE y
            # Enable scheduler optimizations
            scripts/config set kernel-out/.config CONFIG_SCHED_MC_PROMOTE y
            scripts/config set kernel-out/.config CONFIG_SCHED_SMT y
            # Enable CPU isolation for big cores
            scripts/config set kernel-out/.config CONFIG_CPU_ISOLATION y
            make -C kernel-out olddefconfig 2>&1 | tail -10
          fi

      - name: Validate yazhu kernel configuration
        run: |
          cd /repo_root
          if [ -f kernel-out/.config ]; then
            echo "yazhu kernel configuration validated"
            make -C kernel-out kernelrelease O=./kernel-out 2>&1
            make -C kernel-out image_check 2>&1 | tail -5
          else
            echo "WARNING: .config not found, generating basic config"
            # Generate a basic config from the device tree
            make -C ${KERNEL_SOURCE_PATH} defconfig O=./kernel-out 2>&1 | tail -10
          fi

      - name: Build yazhu kernel image
        run: |
          cd /repo_root
          echo "Building yazhu kernel image..."
          make -C ${KERNEL_SOURCE_PATH} -j$(nproc) Image.gz-dtb O=./kernel-out 2>&1 | tail -50
          # Also build zImage as fallback
          make -C ${KERNEL_SOURCE_PATH} -j$(nproc) zImage O=./kernel-out 2>&1 | tail -20

      - name: Upload yazhu kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yazhu-kernel-${{ github.sha }}
          path: |
            /repo_root/kernel-out/Image.gz-dtb
            /repo_root/kernel-out/zImage
            /repo_root/kernel-out/.config
          retention-period: 90 days

      - name: Publish yazhu kernel metadata
        run: |
          echo "kernel_name: yazhu" > /repo_root/kernel-metadata.txt
          echo "commit: ${GitHub_SHA}" >> /repo_root/kernel-metadata.txt
          echo "built_on: $(date -u)" >> /repo_root/kernel-metadata.txt
          echo "device: CPH2487 / udon (OnePlus 11R)" >> /repo_root/kernel-metadata.txt
          echo "defconfig: vendor/taro-yazhu_defconfig" >> /repo_root/kernel-metadata.txt
          echo "performance_optimizations: preempt-none, sched_mc_promote, sched_smt, cpu_isolation" >> /repo_root/kernel-metadata.txt
        working-directory: /repo_root

      - name: Upload yazhu kernel metadata
        uses: actions/upload-artifact@v4
        with:
          name: yazhu-kernel-metadata
          path: /repo_root/kernel-metadata.txt
          retention-period: 90 days

      - name: Confirm yazhu kernel build status
        run: |
          echo "=========================================="
          echo "  yazhu kernel build completed"
          echo "=========================================="
          echo "Kernel: yazhu"
          echo "Device: OnePlus 11R (CPH2487 / udon)"
          echo "SoC: SM8475 (Snapdragon 8+ Gen 1)"
          echo "Defconfig: vendor/taro-yazhu_defconfig"
          echo "Status: ✅ Success"
          echo "=========================================="